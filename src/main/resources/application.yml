spring:
  application:
    name: food_recommend_back

  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: app_backend
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

firebase:
  # 로컬 테스트(맥): cat serviceAccountKey.json | base64 | pbcopy
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}