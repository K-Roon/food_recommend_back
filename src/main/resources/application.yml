spring:
  application:
    name: food_recommend_back
#  profiles:
#    active:
#      local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

firebase:
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64}

server:
  port: 8080